save_recipes:
  name: Rezepte speichern
  description: Speichert die Rezeptliste aus der Web-App.
  fields:
    encoded:
      name: Kodierte Daten
      description: Base64-kodierte JSON-Rezeptliste.
      required: true
      selector:
        text:

announce_timer:
  name: Timer-Ende ankündigen
  description: Gibt eine Ansage auf konfigurierten Lautsprechern aus wenn ein Koch-Timer abläuft.
  fields:
    step_num:
      name: Schrittnummer
      description: Nummer des Kochschritts.
      required: true
      example: 3
      selector:
        number:
          min: 1
          max: 99
    alexa_players:
      name: Alexa-Geräte
      description: Echo-Geräte für die Ansage via Alexa Announce.
      required: false
      selector:
        entity:
          domain: media_player
          multiple: true
    tts_players:
      name: TTS-Geräte
      description: Andere Lautsprecher für die Ansage via HA TTS.
      required: false
      selector:
        entity:
          domain: media_player
          multiple: true
