save_recipes:
  fields:
    encoded:
      description: Base64-kodierte Rezeptliste (JSON)
      example: "eyJyZWNpcGVzIjpbXX0="

announce_timer:
  fields:
    step_num:
      description: Schritt-Nummer für die Ansage
      example: 2
    alexa_players:
      description: Alexa-Geräte (überschreibt Integration-Einstellung)
      example: ["media_player.echo_kuche"]
    tts_players:
      description: TTS-Geräte (überschreibt Integration-Einstellung)
      example: ["media_player.wohnzimmer"]

timer_start:
  fields:
    duration:
      description: Timer-Dauer in Sekunden
      example: 300
    step_num:
      description: Schritt-Nummer (für Ansage bei Timer-Ende)
      example: 2

timer_pause:

timer_resume:

timer_cancel:
